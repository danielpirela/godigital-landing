<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>GoDigital — Markdown vs HTML/CSS/JS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #06080d;
      --bg: #0a0d14;
      --primary: #0066ff;
      --primary-glow: rgba(0, 102, 255, 0.55);
      --text: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.65);
      --text-muted: rgba(255, 255, 255, 0.35);
      --glass-bg: rgba(8, 10, 16, 0.55);
      --glass-border: rgba(255, 255, 255, 0.08);
      --danger: #ff2244;
      --danger-glow: rgba(255, 34, 68, 0.6);
      --success: #00e676;
      --success-glow: rgba(0, 230, 118, 0.55);
    }

    body {
      margin: 0; padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-deep);
      overflow: hidden;
      color: var(--text);
    }

    [data-composition-id] {
      width: 1080px;
      height: 1920px;
      position: relative;
      background: radial-gradient(ellipse 80% 60% at 50% 45%, rgba(0, 70, 180, 0.12) 0%, transparent 70%),
                  var(--bg-deep);
    }

    /* ── Ambient Background & Orbs ── */
    .bg-ambient {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 0;
      pointer-events: none;
    }
    .bg-orb {
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 102, 255, 0.08) 0%, transparent 70%);
      filter: blur(80px);
      will-change: transform;
    }
    .bg-orb.a { top: 15%; left: -10%; }
    .bg-orb.b { top: 60%; right: -15%; }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.7);
      will-change: transform, opacity;
      pointer-events: none;
    }

    /* ── Cinematic Transition Flash Overlay ── */
    .transition-flash {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(8, 30, 70, 0.55);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
    }

    /* ── Typography Accents ── */
    .scene-title {
      font-size: 56px; font-weight: 800;
      letter-spacing: -1.5px;
      color: var(--text);
      text-align: center;
      line-height: 1.25;
      margin-bottom: 60px;
      z-index: 5;
    }
    .accent-red {
      color: var(--danger);
      text-shadow: 0 0 40px var(--danger-glow);
    }
    .accent-blue {
      color: var(--primary);
      text-shadow: 0 0 40px var(--primary-glow);
    }

    /* ── SCENE 1: Flat Markdown (0s — 1.8s) ── */
    .scene-markdown {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 1;
      opacity: 0;
    }

    .editor-card {
      width: 800px;
      background: #0f1115;
      border: 1px solid rgba(255, 34, 68, 0.25);
      border-radius: 16px;
      padding: 36px;
      font-family: 'Fira Code', monospace;
      box-shadow: 0 20px 60px rgba(255, 34, 68, 0.05);
      position: relative;
      overflow: hidden;
    }
    .editor-header {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
    }
    .editor-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
    }
    .editor-dot.red { background: var(--danger); }

    .editor-code {
      font-size: 32px;
      line-height: 1.7;
      color: var(--text-dim);
    }
    .code-comment { color: var(--text-muted); }
    .code-tag { color: var(--danger); }
    .code-string { color: #f2ca30; }

    .stamp-boring {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) rotate(-12deg) scale(2);
      border: 4px solid var(--danger);
      color: var(--danger);
      font-size: 54px;
      font-weight: 900;
      padding: 12px 32px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 4px;
      background: rgba(15, 17, 21, 0.95);
      box-shadow: 0 0 40px var(--danger-glow);
      opacity: 0;
      z-index: 10;
      will-change: transform, opacity;
    }

    /* ── SCENE 2: Glassmorphic Component (1.8s — 4.2s) ── */
    .scene-interactive {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 2;
      opacity: 0;
    }

    .glass-card {
      width: 820px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 48px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.08);
      position: relative;
      overflow: hidden;
    }

    .glass-card-header {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 40px;
    }
    .glass-icon-container {
      width: 80px; height: 80px;
      border-radius: 16px;
      background: rgba(0, 102, 255, 0.15);
      border: 1px solid rgba(0, 102, 255, 0.3);
      display: flex; align-items: center; justify-content: center;
    }
    .glass-icon {
      width: 40px; height: 40px;
      color: var(--primary);
      filter: drop-shadow(0 0 8px rgba(0, 102, 255, 0.5));
    }
    .glass-header-text {
      display: flex;
      flex-direction: column;
    }
    .glass-card-title {
      font-size: 30px;
      font-weight: 700;
      color: var(--text);
    }
    .glass-card-subtitle {
      font-size: 20px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .glass-meter-container {
      margin-top: 36px;
      margin-bottom: 48px;
      width: 100%;
    }
    .glass-meter-label {
      display: flex;
      justify-content: space-between;
      font-size: 24px;
      color: var(--text-dim);
      margin-bottom: 12px;
      font-weight: 500;
    }
    .meter-val {
      color: var(--primary);
      font-weight: 700;
    }
    .glass-meter-bg {
      width: 100%; height: 16px;
      background: rgba(255,255,255,0.05);
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.02);
    }
    .glass-meter-fill {
      width: 0%; height: 100%;
      background: linear-gradient(90deg, var(--primary), #00d2ff);
      box-shadow: 0 0 20px rgba(0, 102, 255, 0.6);
      border-radius: 99px;
    }

    .glass-btn-row {
      display: flex;
      justify-content: flex-end;
      position: relative;
    }
    .glass-btn {
      background: var(--primary);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 28px;
      font-weight: 700;
      padding: 20px 48px;
      border-radius: 99px;
      box-shadow: 0 0 30px rgba(0, 102, 255, 0.3), inset 0 1px 0 rgba(255,255,255,0.2);
      cursor: pointer;
      transform-origin: center center;
      will-change: transform, box-shadow;
    }

    .scene-cursor {
      position: absolute;
      width: 60px; height: 60px;
      pointer-events: none;
      z-index: 100;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
      will-change: transform;
      top: 0; left: 0;
    }
    .scene-cursor svg {
      width: 100%; height: 100%;
    }

    /* ── SCENE 3: Outro Logo (4.2s — 6.0s) ── */
    .scene-outro {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 3;
      opacity: 0;
    }

    .logo-wrapper {
      width: 700px;
      opacity: 0;
      will-change: transform, opacity, filter;
      filter: drop-shadow(0 0 40px rgba(0,102,255,0.3));
    }
    .logo-wrapper img {
      width: 100%; height: 100%;
      object-fit: contain;
    }
    .outro-tagline {
      font-size: 38px; font-weight: 600;
      color: var(--text-dim);
      margin-top: 48px;
      letter-spacing: -0.5px;
      text-align: center;
      opacity: 0;
      will-change: transform, opacity;
    }
  </style>
</head>
<body>

  <div data-composition-id="main" data-width="1080" data-height="1920" data-start="0" data-duration="6">

    <!-- ═══ BACKGROUND AMBIENCE ═══ -->
    <div class="bg-ambient">
      <div class="bg-orb a" id="orb-a"></div>
      <div class="bg-orb b" id="orb-b"></div>
    </div>

    <!-- ═══ AMBIENT PARTICLES ═══ -->
    <div id="particles-container" class="bg-ambient"></div>

    <!-- ═══ TRANSITION OVERLAY ═══ -->
    <div class="transition-flash" id="flash-overlay"></div>

    <!-- ═══ SCENE 1: FLAT MARKDOWN (0.0s — 1.8s) ═══ -->
    <div class="scene-markdown" id="scene1" data-layout-allow-overflow>
      <h2 class="scene-title" id="scene1-title">¿IA QUE SOLO ESCRIBE<br><span class="accent-red">MARKDOWN</span>?</h2>
      
      <div class="editor-card" id="scene1-editor">
        <div class="editor-header">
          <div class="editor-dot red"></div>
          <div class="editor-dot"></div>
          <div class="editor-dot"></div>
        </div>
        <div class="editor-code">
          <div id="md-line-1"><span class="code-comment"># Titulo Plano</span></div>
          <div id="md-line-2">- Sin animaciones</div>
          <div id="md-line-3">- Sin interactividad</div>
          <div id="md-line-4"><span class="code-tag">&lt;div&gt;</span>Estático<span class="code-tag">&lt;/div&gt;</span></div>
        </div>
        <!-- Warning stamp -->
        <div class="stamp-boring" id="stamp-boring">Aburrido</div>
      </div>
    </div>

    <!-- ═══ SCENE 2: INTERACTIVE OUTPUT (1.8s — 4.2s) ═══ -->
    <div class="scene-interactive" id="scene2" data-layout-allow-overflow>
      <h2 class="scene-title" id="scene2-title">¡CON <span class="accent-blue">HTML/CSS/JS</span><br>CREAS EN VIVO!</h2>
      
      <div class="glass-card" id="scene2-card">
        <div class="glass-card-header">
          <div class="glass-icon-container">
            <svg class="glass-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
          </div>
          <div class="glass-header-text">
            <div class="glass-card-title">Componente Vivo</div>
            <div class="glass-card-subtitle">Renderizado dinámico</div>
          </div>
        </div>

        <div class="glass-meter-container">
          <div class="glass-meter-label">
            <span>Rendimiento Web</span>
            <span class="meter-val" id="meter-val">0%</span>
          </div>
          <div class="glass-meter-bg">
            <div class="glass-meter-fill" id="meter-fill"></div>
          </div>
        </div>

        <div class="glass-btn-row">
          <button class="glass-btn" id="glass-action-btn">Desplegar</button>
        </div>
      </div>

      <!-- Pointer cursor absolute coordinates inside composition -->
      <div class="scene-cursor" id="scene2-cursor">
        <svg viewBox="0 0 24 24" fill="white">
          <path d="M5.5 3.21V20.8c0 .45.54.67.85.35l4.86-4.86a.5.5 0 0 1 .35-.15h6.87a.5.5 0 0 0 .35-.85L5.5 3.21z" stroke="black" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <!-- ═══ SCENE 3: OUTRO (4.2s — 6.0s) ═══ -->
    <div class="scene-outro" id="scene3" data-layout-allow-overflow>
      <div class="logo-wrapper" id="outro-logo">
        <img src="assets/logo-dark.svg" alt="GoDigital Logo" />
      </div>
      <p class="outro-tagline" id="outro-tagline">Tu visión en código vivo.</p>
    </div>

    <!-- ═══ 🎵 AUDIO SYNCHRONIZATION ═══ -->
    <!-- BGM Loop: 808 Trap beat (0-6s) -->
    <audio id="bgm-trap" src="assets/audio/beetpro-808-kick-boom-bass-snare-hit-hats-roll-140-bpm-3-trap-loop-15-12764.mp3" data-track-index="80" data-start="0" data-volume="0.3"></audio>
    <!-- Keyboard typing: Scene 1 -->
    <audio id="sfx-typing" src="assets/audio/freesound_community-keyboard-typing-5997.mp3" data-track-index="81" data-start="0.2" data-volume="0.55"></audio>
    <!-- Error stamp: Scene 1 boring mark -->
    <audio id="sfx-error" src="assets/audio/soundshelfstudio-ui-error-pop-515668.mp3" data-track-index="82" data-start="1.1" data-volume="0.65"></audio>
    <!-- Whoosh transition: Transition 1->2 -->
    <audio id="sfx-swoosh" src="assets/audio/dragon-studio-swoosh-riser-reverb-390309.mp3" data-track-index="83" data-start="1.55" data-volume="0.5"></audio>
    <!-- UI Pop Click: Scene 2 pointer impact -->
    <audio id="sfx-click" src="assets/audio/47313572-ui-pop-sound-316482.mp3" data-track-index="84" data-start="3.1" data-volume="0.65"></audio>
    <!-- Bass boom: Scene 3 entry -->
    <audio id="sfx-boom" src="assets/audio/freesound_community-bass-dropmp3-14596.mp3" data-track-index="85" data-start="4.15" data-volume="0.7"></audio>
    <!-- Gold coin ping: Scene 3 logo glow -->
    <audio id="sfx-coin" src="assets/audio/izafi-gold-coin-sound-437271.mp3" data-track-index="86" data-start="4.7" data-volume="0.55"></audio>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    /* ═══════════════════════════════════════════════════════════════
       PARTICLES SYSTEM — 30 floating particles
    ═══════════════════════════════════════════════════════════════ */
    const pc = document.getElementById('particles-container');
    const particles = [];
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 2 + (Math.abs((i * 7 + 3) % 13)) * 0.6;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = ((i * 37 + 13) % 100) + '%';
      p.style.top = ((i * 53 + 7) % 100) + '%';
      p.style.opacity = (0.15 + (i % 5) * 0.08);
      pc.appendChild(p);
      particles.push(p);
    }

    /* ═══════════════════════════════════════════════════════════════
       BACKGROUND: ORBS + PARTICLES (0.0s — 6.0s)
    ═══════════════════════════════════════════════════════════════ */
    tl.to("#orb-a", { x: 30, y: -25, scale: 1.1, duration: 6, ease: "sine.inOut" }, 0);
    tl.to("#orb-b", { x: -30, y: 25, scale: 0.9, duration: 6, ease: "sine.inOut" }, 0);

    particles.forEach((p, i) => {
      const driftY = -40 - (i % 5) * 10 + ((i * 7 + 13) % 20);
      const driftX = (i % 3 === 0 ? 1 : -1) * (15 + (i % 7) * 4);
      tl.to(p, {
        y: driftY,
        x: driftX,
        opacity: 0.06 + (i % 4) * 0.04,
        duration: 3 + (i % 3),
        ease: "sine.inOut",
        repeat: 1,
        yoyo: true
      }, i * 0.05);
    });

    /* ═══════════════════════════════════════════════════════════════
       SCENE 1: FLAT MARKDOWN (0.0s — 1.77s)
    ═══════════════════════════════════════════════════════════════ */
    tl.set("#scene1", { opacity: 1, visibility: "visible" }, 0);

    // Title Entrance
    tl.fromTo("#scene1-title", 
      { y: -40, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
      0.1
    );

    // Editor Card Entrance
    tl.fromTo("#scene1-editor",
      { scale: 0.8, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.6, ease: "expo.out" },
      0.15
    );

    // Flat Code typing sequence
    tl.from("#md-line-1", { opacity: 0, x: -15, duration: 0.15 }, 0.3);
    tl.from("#md-line-2", { opacity: 0, x: -15, duration: 0.15 }, 0.5);
    tl.from("#md-line-3", { opacity: 0, x: -15, duration: 0.15 }, 0.7);
    tl.from("#md-line-4", { opacity: 0, x: -15, duration: 0.15 }, 0.9);

    // Boring stamp slam
    tl.fromTo("#stamp-boring",
      { scale: 3, opacity: 0, rotation: 30 },
      { scale: 1, opacity: 1, rotation: -12, duration: 0.25, ease: "bounce.out" },
      1.1
    );

    /* ═══════════════════════════════════════════════════════════════
       TRANSITION 1→2: CINEMATIC FLASH (1.77s)
    ═══════════════════════════════════════════════════════════════ */
    tl.set("#scene1", { opacity: 0, visibility: "hidden" }, 1.77);
    tl.set("#scene2", { opacity: 1, zIndex: 3, visibility: "visible" }, 1.77);

    tl.fromTo("#flash-overlay",
      { opacity: 0 },
      { opacity: 0.9, duration: 0.12, ease: "power2.out", overwrite: "auto" },
      1.68
    );
    tl.to("#flash-overlay",
      { opacity: 0, duration: 0.15, ease: "power2.in", overwrite: "auto" },
      1.80
    );

    /* ═══════════════════════════════════════════════════════════════
       SCENE 2: INTERACTIVE COMPONENT (1.77s — 4.2s)
    ═══════════════════════════════════════════════════════════════ */
    // Title Entrance
    tl.from("#scene2-title", { y: -40, opacity: 0, duration: 0.5, ease: "power2.out" }, 1.85);

    // Glass Card Entrance
    tl.fromTo("#scene2-card",
      { scale: 0.75, opacity: 0, y: 60 },
      { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "back.out(1.4)" },
      1.85
    );

    // Cursor movement sequence
    // Button is physically centered at bottom right, let's map coordinates:
    // Glass card center is x=540, y=960. Cursor starts at bottom right (x=900, y=1400)
    // Moves to button position (approx x=660, y=1180 relative to viewport)
    tl.fromTo("#scene2-cursor",
      { x: 900, y: 1400, opacity: 0 },
      { x: 670, y: 1120, opacity: 1, duration: 0.8, ease: "power3.out" },
      2.3
    );

    // Click Impact (at 3.1s)
    tl.to("#glass-action-btn", { scale: 0.92, duration: 0.08, yoyo: true, repeat: 1 }, 3.1);

    // Progress fills up
    tl.to("#meter-fill", { width: "100%", duration: 0.7, ease: "power2.out" }, 3.15);

    // Animate numerical score 0% -> 100%
    const meterValObj = { value: 0 };
    tl.to(meterValObj, {
      value: 100,
      duration: 0.7,
      ease: "power2.out",
      onUpdate: function() {
        document.getElementById("meter-val").textContent = Math.round(this.targets()[0].value) + "%";
      }
    }, 3.15);

    // Button Glow explosion
    tl.to("#glass-action-btn", {
      boxShadow: "0 0 50px rgba(0, 102, 255, 0.85), inset 0 1px 0 rgba(255,255,255,0.2)",
      duration: 0.3
    }, 3.18);

    // Cursor slides away
    tl.to("#scene2-cursor", { x: 770, y: 1250, opacity: 0, duration: 0.4, ease: "power2.in" }, 3.5);

    /* ═══════════════════════════════════════════════════════════════
       TRANSITION 2→3: ENERGY FLASH (4.2s)
    ═══════════════════════════════════════════════════════════════ */
    tl.set("#scene2", { opacity: 0, visibility: "hidden" }, 4.2);
    tl.set("#scene3", { opacity: 1, zIndex: 4, visibility: "visible" }, 4.2);

    tl.fromTo("#flash-overlay",
      { opacity: 0 },
      { opacity: 0.95, duration: 0.12, ease: "power2.out", overwrite: "auto" },
      4.1
    );
    tl.to("#flash-overlay",
      { opacity: 0, duration: 0.2, ease: "power2.in", overwrite: "auto" },
      4.22
    );

    /* ═══════════════════════════════════════════════════════════════
       SCENE 3: BRAND FINALE (4.2s — 6.0s)
    ═══════════════════════════════════════════════════════════════ */
    // SVG Logo scales in with back ease
    tl.fromTo("#outro-logo",
      { scale: 0.6, opacity: 0, y: 50 },
      { scale: 1.05, opacity: 1, y: 0, duration: 0.65, ease: "back.out(1.6)" },
      4.25
    );
    tl.to("#outro-logo",
      { scale: 1, duration: 0.4, ease: "power2.out" },
      4.9
    );

    // Subtle breathing pulse on logo drop-shadow glow
    tl.to("#outro-logo", {
      filter: "drop-shadow(0 0 60px rgba(0, 102, 255, 0.6))",
      duration: 0.7,
      ease: "sine.inOut",
      repeat: 1,
      yoyo: true
    }, 5.0);

    // Tagline Entrance
    tl.fromTo("#outro-tagline",
      { y: 35, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" },
      4.7
    );

    // FINAL FADE OUT
    tl.to("#scene3", { opacity: 0, duration: 0.7, ease: "power2.in" }, 5.3);
    tl.set("#scene3", { visibility: "hidden" }, 6.0);

    /* ═══════════════════════════════════════════════════════════════
       REGISTER TIMELINE
    ═══════════════════════════════════════════════════════════════ */
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
