<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GoDigital - Promo Vertical</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #05050A; /* Fallback oscuro */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    .scene-content {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      padding-top: 100px;
    }

    .background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    /* Isla Dinámica - Optimizada como Hook */
    .dynamic-island {
      width: 80px;
      height: 80px;
      background: rgba(10, 10, 15, 0.9);
      border-radius: 80px;
      box-shadow: 0 20px 80px rgba(0,0,0,0.8), inset 0 2px 2px rgba(255,255,255,0.1);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transform-origin: top center;
      z-index: 10;
    }

    .island-text {
      position: absolute;
      color: #fff;
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -1px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
    }

    .island-accent {
      color: #38bdf8; /* Un cian más eléctrico y llamativo para TikTok */
    }

    /* Contenido Central: Prototipo y Badges */
    .center-showcase {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    .glass-card {
      width: 860px;
      height: 1100px;
      background: linear-gradient(145deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.01) 100%);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 40px;
      box-shadow: 0 50px 120px rgba(0,0,0,0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow: hidden;
      position: relative;
      opacity: 0;
      /* Para el clipping interior de la imagen parallax */
    }

    .prototype-img {
      width: 100%;
      height: auto; /* Dejar fluir para el parallax con yPercent */
      object-fit: cover;
      object-position: top;
      opacity: 0.95;
    }

    /* Badges de Marketing / Social Proof */
    .badge {
      position: absolute;
      padding: 28px 48px;
      background: rgba(255, 255, 255, 0.98);
      color: #05050A;
      font-size: 36px;
      font-weight: 800;
      border-radius: 24px; /* Un poco más cuadrado para IG/TK */
      box-shadow: 0 30px 60px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      gap: 16px;
      opacity: 0;
      letter-spacing: -1px;
      border: 2px solid rgba(255,255,255,1);
      z-index: 999;
    }

    .badge-left {
      top: 10%;
      left: 10px;
      transform: translateX(-40px);
    }

    .badge-right {
      bottom: 15%;
      right: 10px;
      transform: translateX(40px);
      background: #38bdf8;
      color: #000;
      border-color: #38bdf8;
    }

    /* Logo Oscuro con Glow para contraste */
    .logo-scene {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 20;
    }
    
    .logo {
      width: 600px;
      position: relative;
      opacity: 0;
    }
  </style>
</head>
<body>

  <div data-composition-id="dynamic-island" data-width="1080" data-height="1920" data-start="0" data-duration="12">
    
    <img id="bg" src="assets/bg-glass-dark.png" class="background clip" data-track-index="0" data-start="0" data-duration="12" />

    <div id="scene1" class="scene-content clip" data-track-index="1" data-start="0" data-duration="12">
      
      <!-- Top Hook -->
      <div class="dynamic-island">
        <div id="text1" class="island-text">La landing perfecta no <span class="island-accent">exis...</span></div>
        <div id="text2" class="island-text">100/100 Lighthouse <span class="island-accent">+ UX</span></div>
        <div id="text3" class="island-text">Tu competencia ya está <span class="island-accent">temblando</span></div>
      </div>
      
      <!-- Main Content -->
      <div class="center-showcase">
        <div class="badge badge-left" id="badge1">Velocidad Absoluta</div>
        <div class="glass-card" id="hero-card">
          <img src="assets/landing-prototipe.png" class="prototype-img" id="proto-img" />
        </div>
        <div class="badge badge-right" id="badge2">SEO Dominado</div>
      </div>
      
      <!-- Final Branding -->
      <div class="logo-scene">
        <img src="assets/logo-dark.svg" class="logo" id="main-logo" />
      </div>
      
    </div>

    <!-- AUDIO SFX (Sound Design para retención) -->
    <!-- Isla Dinámica baja (0.05s) -->
    <audio id="sfx-whoosh-1" src="assets/audio/short-whoosh.mp3" data-track-index="2" data-start="0.05" data-volume="0.6"></audio>
    
    <!-- Prototipo sube (0.5s) -->
    <audio id="sfx-swish-1" src="assets/audio/long-swish.mp3" data-track-index="3" data-start="0.5" data-volume="0.8"></audio>
    
    <!-- Isla cambia texto 2 (3.1s) -->
    <audio id="sfx-pop-1" src="assets/audio/pop.mp3" data-track-index="4" data-start="3.1" data-volume="0.5"></audio>
    
    <!-- Badge 1 entra (3.2s) -->
    <audio id="sfx-pop-2" src="assets/audio/pop.mp3" data-track-index="5" data-start="3.2" data-volume="0.8"></audio>
    
    <!-- Badge 2 entra (3.4s) -->
    <audio id="sfx-pop-3" src="assets/audio/pop.mp3" data-track-index="6" data-start="3.4" data-volume="0.8"></audio>
    
    <!-- Isla cambia texto 3 (6.6s) -->
    <audio id="sfx-pop-4" src="assets/audio/pop.mp3" data-track-index="7" data-start="6.6" data-volume="0.5"></audio>
    
    <!-- Todo sale de escena (8.5s) -->
    <audio id="sfx-swish-2" src="assets/audio/long-swish.mp3" data-track-index="8" data-start="8.5" data-volume="0.8"></audio>
    
    <!-- Logo Reveal (9.2s) -->
    <audio id="sfx-bell-1" src="assets/audio/bell.mp3" data-track-index="9" data-start="9.2" data-volume="1.0"></audio>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.set(".dynamic-island", { width: 80, height: 80 });

    /* =========================================================================
       1. EL HOOK (0.0s - 0.5s)
       Retención pura. Acción en los primeros frames.
       ========================================================================= */
    // Fondo vivo
    tl.fromTo("#bg", { scale: 1.15 }, { scale: 1, duration: 12, ease: "power1.out" }, 0);

    // Isla cae como bloque pesado y se expande rapidísimo
    tl.set(".dynamic-island", { width: 80, height: 80, y: -150 });
    tl.to(".dynamic-island", { y: 0, duration: 0.5, ease: "back.out(1.5)" }, 0.05);
    tl.to(".dynamic-island", { width: 960, height: 130, duration: 0.8, ease: "elastic.out(1, 0.6)" }, 0.3);
    
    tl.fromTo("#text1", 
      { opacity: 0, y: 20 }, 
      { opacity: 1, y: 0, duration: 0.4, ease: "back.out(2)" }, 
      0.5
    );

    /* =========================================================================
       2. REVELACIÓN IMPACTANTE DEL PRODUCTO (0.6s)
       El prototipo sube con fuerza y no se queda quieto nunca.
       ========================================================================= */
    tl.fromTo("#hero-card", 
      { y: 800, scale: 0.85, rotationX: 15, opacity: 0 },
      { y: 50, scale: 1, rotationX: 0, opacity: 1, duration: 0.8, ease: "expo.out" },
      0.5
    );
    // Parallax del sitio web (Simula un scroll súper fluido)
    tl.fromTo("#proto-img",
      { yPercent: 0 },
      { yPercent: -30, duration: 8, ease: "power2.out" },
      0.5
    );
    // Para que la UI no quede muerta, le damos una levitación sutil y constante a la carta entera
    tl.to("#hero-card", { y: 30, duration: 3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.3);

    /* =========================================================================
       3. SOCIAL PROOF SNAPPY (3.0s)
       Cambio brusco de texto para renovar atención y badges que golpean.
       ========================================================================= */
    tl.to("#text1", { opacity: 0, y: -20, duration: 0.2 }, 3.0);
    tl.fromTo("#text2", 
      { opacity: 0, y: 20 },
      { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" },
      3.1
    );

    tl.fromTo("#badge1",
      { x: -200, opacity: 0, rotation: -10, scale: 0.5 },
      { x: 0, opacity: 1, rotation: -3, scale: 1, duration: 0.6, ease: "back.out(1.7)" },
      3.2
    );
    tl.fromTo("#badge2",
      { x: 200, opacity: 0, rotation: 10, scale: 0.5 },
      { x: 0, opacity: 1, rotation: 3, scale: 1, duration: 0.6, ease: "back.out(1.7)" },
      3.4
    );

    /* =========================================================================
       4. FOMO (6.5s)
       Preparando al usuario para el final
       ========================================================================= */
    tl.to("#text2", { opacity: 0, y: -20, duration: 0.2 }, 6.5);
    tl.fromTo("#text3", 
      { opacity: 0, y: 20 },
      { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" },
      6.6
    );

    /* =========================================================================
       5. OUTRO EXPLOSIVO Y LOGO (9.0s)
       Barremos todo de la pantalla rápido y clavamos el logo oscuro.
       ========================================================================= */
    tl.to([".dynamic-island", "#hero-card", ".badge"], {
      y: -1200, opacity: 0, stagger: 0.05, duration: 0.6, ease: "power3.in"
    }, 8.5);

    // Entra el logo oscuro clavándose
    tl.fromTo("#main-logo",
      { opacity: 0, scale: 3 },
      { opacity: 1, scale: 1, duration: 0.7, ease: "expo.out" },
      9.2
    );

    window.__timelines["dynamic-island"] = tl;
  </script>
</body>
</html>
