<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>GoDigital Teaser</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0e12;
      --primary: #0066ff;
      --surface: rgba(36, 39, 44, 0.5);
      --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --text-muted: #b3c5ff;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      overflow: hidden;
      color: var(--text);
    }

    [data-composition-id] {
      width: 1080px;
      height: 1920px;
      position: relative;
      background: 
        radial-gradient(circle at 10% 20%, rgba(0, 102, 255, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 70%, rgba(26, 29, 33, 0.8) 0%, transparent 50%),
        var(--bg);
    }

    /* SCENE 1: Build in Public */
    .scene-build {
      width: 100%;
      height: 100%;
      padding: 100px 80px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .watermark {
      position: absolute;
      top: 40px;
      right: 80px;
      width: 280px;
      opacity: 0.4;
    }

    /* Console */
    .console {
      margin-top: 140px;
      background: var(--surface);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 50px;
      box-shadow: 0 40px 80px rgba(0,0,0,0.4);
      min-height: 280px;
    }

    .console-header {
      display: flex;
      gap: 16px;
      margin-bottom: 40px;
    }

    .dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
    }
    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }

    .console-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 32px;
      line-height: 1.8;
      color: var(--text-muted);
    }

    .console-line {
      display: block;
      min-height: 58px;
    }

    /* UI Grid */
    .ui-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin-top: 80px;
    }

    .card {
      background: linear-gradient(145deg, rgba(42, 46, 53, 0.6), rgba(26, 29, 33, 0.4));
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 50px 40px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    .card-icon {
      width: 80px;
      height: 80px;
      border-radius: 24px;
      background: rgba(0, 102, 255, 0.15);
      border: 2px solid rgba(0, 102, 255, 0.4);
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-icon::after {
      content: '';
      width: 30px;
      height: 30px;
      background: var(--primary);
      border-radius: 10px;
      box-shadow: 0 0 20px var(--primary);
    }

    .card h3 {
      margin: 0 0 16px 0;
      font-size: 36px;
      font-weight: 700;
    }

    .card p {
      margin: 0;
      font-size: 24px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Buttons */
    .btn-group {
      display: flex;
      gap: 32px;
      margin-top: 80px;
      justify-content: center;
    }

    .btn {
      padding: 32px 64px;
      border-radius: 100px;
      font-size: 36px;
      font-weight: 700;
      text-align: center;
    }

    .btn.primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 20px 40px rgba(0, 102, 255, 0.3);
    }

    .btn.ghost {
      background: transparent;
      border: 2px solid rgba(255, 255, 255, 0.2);
      color: white;
    }

    /* SCENE 2: Outro Overlay */
    .scene-outro {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(11, 14, 18, 0.85);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .outro-logo {
      width: 800px;
      margin-bottom: 60px;
    }

    .outro-slogan {
      font-size: 48px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: -1px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Root Composition -->
  <div data-composition-id="teaser" data-width="1080" data-height="1920" data-start="0" data-duration="11" data-track-index="0">
    
    <!-- Scene 1: The Build -->
    <div class="scene-build" id="scene-build">
      <img src="../../assets/logo-dark.svg" class="watermark" alt="GoDigital">
      
      <!-- Console -->
      <div class="console" id="console">
        <div class="console-header">
          <div class="dot red"></div>
          <div class="dot yellow"></div>
          <div class="dot green"></div>
        </div>
        <div class="console-text">
          <span class="console-line" id="c-line1"></span>
          <span class="console-line" id="c-line2"></span>
          <span class="console-line" id="c-line3"></span>
        </div>
      </div>

      <!-- UI Cards Grid -->
      <div class="ui-grid">
        <div class="card">
          <div class="card-icon"></div>
          <h3>UX / UI</h3>
          <p>Diseño centrado en el usuario.</p>
        </div>
        <div class="card">
          <div class="card-icon"></div>
          <h3>Desarrollo Web</h3>
          <p>Arquitectura de alto nivel.</p>
        </div>
        <div class="card">
          <div class="card-icon"></div>
          <h3>App Mobile</h3>
          <p>Experiencias nativas.</p>
        </div>
        <div class="card">
          <div class="card-icon"></div>
          <h3>SEO Técnico</h3>
          <p>Visibilidad estratégica.</p>
        </div>
      </div>

      <!-- Actions -->
      <div class="btn-group">
        <div class="btn primary">Cotizar Proyecto</div>
        <div class="btn ghost">Ver Proceso</div>
      </div>
    </div>

    <!-- Scene 2: Outro (Covers Scene 1 as transition) -->
    <div class="scene-outro" id="scene-outro">
      <img src="../../assets/logo-dark.svg" class="outro-logo" alt="GoDigital">
      <p class="outro-slogan">Tu éxito digital, en construcción.</p>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/TextPlugin.min.js"></script>
  <script>
    gsap.registerPlugin(TextPlugin);
    window.__timelines = window.__timelines || {};
    
    const tl = gsap.timeline({ paused: true });

    // Ensure Outro is invisible initially (since CSS defines the end state, we must hide it at t=0)
    // Wait, HyperFrames rules say to use tl.from() for entrances.
    // So the CSS state is the final visible state. We hide it by animating FROM opacity 0.
    
    // --- SCENE 1: ENTRANCES ---
    
    // Watermark
    tl.from(".watermark", { opacity: 0, y: -40, duration: 1.5, ease: "power2.out" }, 0.2);

    // AI Console
    tl.from("#console", { opacity: 0, scale: 0.95, y: 60, duration: 1.2, ease: "expo.out" }, 0.5);

    // Typing Effect (TextPlugin)
    tl.to("#c-line1", { text: ">_ Iniciando proyecto GoDigital...", duration: 1.2, ease: "none" }, 1.2);
    tl.to("#c-line2", { text: ">_ Creando diseño premium...", duration: 1.2, ease: "none" }, 2.6);
    tl.to("#c-line3", { text: ">_ [Añadiendo componentes]...", duration: 1.0, ease: "none" }, 4.0);

    // UI Components Build (Staggered)
    tl.from(".card", { 
      opacity: 0, 
      scale: 0.8, 
      y: 80, 
      duration: 1.2, 
      stagger: 0.15, 
      ease: "expo.out" 
    }, 4.8);

    // Buttons
    tl.from(".btn", { 
      opacity: 0, 
      y: 40, 
      duration: 1.0, 
      stagger: 0.15, 
      ease: "power2.out" 
    }, 5.8);

    // --- SCENE 2: OUTRO TRANSITION ---
    
    // The outro scene covers the build scene completely via blur & opacity
    tl.from("#scene-outro", { 
      opacity: 0, 
      duration: 1.2, 
      ease: "power2.inOut" 
    }, 8.0);

    // Giant Logo scales up and lands
    tl.from(".outro-logo", { 
      scale: 0.6, 
      opacity: 0, 
      duration: 1.4, 
      ease: "back.out(1.7)" 
    }, 8.8);

    // Slogan fades in
    tl.from(".outro-slogan", { 
      y: 40, 
      opacity: 0, 
      duration: 1.2, 
      ease: "power2.out" 
    }, 9.4);

    // Register timeline
    window.__timelines["teaser"] = tl;
  </script>
</body>
</html>
